# Veni Vidi Vici : l'appli + PocketBase. Usage personnel (voir docs/deploiement-portainer.md).
# Les images sont publiées sur GHCR à chaque push sur main (.github/workflows/publish-images.yml).
# Sur le Pinas on les tire, on ne construit rien. Mise à jour : pull + redéployer la stack, rien d'autre.
# Tout se règle par variables d'environnement (voir .env.example). Aucune adresse n'est écrite ici.

services:
  pocketbase:
    # Version de PocketBase épinglée dans l'image (0.40.6, voir docker/pocketbase.Dockerfile).
    # Le tag `latest` avance à chaque push sur main (migrations comprises).
    image: ghcr.io/ksel31/veni-vidi-vici-pocketbase:latest
    restart: unless-stopped
    ports:
      # Le NAVIGATEUR parle directement à PocketBase : ce port doit être joignable depuis tes appareils.
      - "${POCKETBASE_PORT:-8090}:8090"
    environment:
      # Inscriptions publiques : fermées par défaut (l'admin crée les comptes). INSCRIPTIONS_OUVERTES=true pour rouvrir.
      VVV_INSCRIPTIONS_OUVERTES: ${INSCRIPTIONS_OUVERTES:-false}
    volumes:
      # Volume nommé : les données survivent aux mises à jour et aux recréations du conteneur.
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/ksel31/veni-vidi-vici:latest
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PUBLIC_STORE: pocketbase
      # Adresse de PocketBase telle que le navigateur la voit. À renseigner : aucune valeur par défaut.
      PUBLIC_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL:?Renseigne PUBLIC_POCKETBASE_URL (adresse de PocketBase vue depuis ton navigateur)}
      # Même réglage que côté PocketBase : l'écran d'inscription affiche le formulaire ou « inscriptions fermées ».
      PUBLIC_INSCRIPTIONS_OUVERTES: ${INSCRIPTIONS_OUVERTES:-false}
      PORT: "3000"

volumes:
  pb_data:
