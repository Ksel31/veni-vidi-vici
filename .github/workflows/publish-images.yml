# Publie les images Docker sur GHCR à chaque push sur main (et sur un tag v*).
# Aucun secret à ajouter : on utilise le GITHUB_TOKEN fourni par GitHub.
# Images :
#   ghcr.io/ksel31/veni-vidi-vici                (l'appli, ADAPTER=node)
#   ghcr.io/ksel31/veni-vidi-vici-pocketbase     (PocketBase 0.40.6 + migrations du dépôt)
# Tags : latest (branche main), version de package.json, short SHA, et semver si le push est un tag v*.

name: Publier les images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/ksel31/veni-vidi-vici
  PB_IMAGE: ghcr.io/ksel31/veni-vidi-vici-pocketbase
  # Doit rester aligné avec docker/pocketbase.Dockerfile.
  PB_VERSION: '0.40.6'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Lire la version dans package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 et arm64 : le Dockerfile PocketBase gère déjà les deux (TARGETARCH + empreintes).
      - name: Buildx (amd64 et arm64)
        uses: docker/setup-qemu-action@v3
      - name: Initialiser Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags de l'image appli
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Tags de l'image PocketBase
        id: meta-pb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.PB_VERSION }}
            type=sha,format=short

      - name: Construire et publier l'appli
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Construire et publier PocketBase
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pocketbase.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-pb.outputs.tags }}
          labels: ${{ steps.meta-pb.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
